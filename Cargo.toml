[package]
name = "oceans-ink"
version = "0.1.0"
edition = "2024"
description = "Unofficial Instapaper client for GNOME"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_8"] }
libsecret = "0.9"
gio = "0.22"
glib = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webkit6 = "0.5"
sha2 = "0.11"
